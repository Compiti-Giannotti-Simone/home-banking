<div class="flex min-h-[70vh] items-center justify-center">
  <app-card class="w-full max-w-3xl shadow-xl" padding="p-8">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-semibold text-white">Welcome</h1>
        @if (mode() === 'login') {
          <p class="mt-1 text-sm text-slate-400">Sign in to access your accounts and manage transactions.</p>
        } @else {
          <p class="mt-1 text-sm text-slate-400">Create an account to get started.</p>
        }
      </div>
     
    </div>

    <div class="mt-6">
      @if (errorMessage()) {
        <app-alert class="mb-4" type="error">
          {{ errorMessage() }}
        </app-alert>
      }

      @if(mode() === 'login') {    
        <form class="grid gap-4" (ngSubmit)="submitLogin()">
          <div class="grid gap-2">
          <label class="text-sm text-slate-300">Username or email</label>
          <input
            type="text"
            name="loginIdentifier"
            [(ngModel)]="loginIdentifier"
            class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-white"
            placeholder="your@email.com or username"
            required
            />
          </div>
          <div class="grid gap-2">
            <label class="text-sm text-slate-300">Password</label>
            <input
            type="password"
            name="loginPassword"
            [(ngModel)]="loginPassword"
            class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-white"
            required
            />
        </div>
        <button appButton type="submit" variant="success" class="mt-2" [disabled]="isLoading()">
          {{ isLoading() ? 'Signing in...' : 'Login' }}
        </button>
      </form>
    }

      @if (mode() === 'register') {
        <form class="grid gap-4" (ngSubmit)="submitRegister()">
          <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
            <div class="grid gap-2">
              <label class="text-sm text-slate-300">Name</label>
              <input
                type="text"
                name="registerName"
                [(ngModel)]="registerName"
                class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-white"
                required
              />
            </div>
            <div class="grid gap-2">
              <label class="text-sm text-slate-300">Surname</label>
              <input
                type="text"
                name="registerSurname"
                [(ngModel)]="registerSurname"
                class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-white"
                required
              />
            </div>
          </div>
          <div class="grid gap-2">
            <label class="text-sm text-slate-300">Username</label>
            <input
              type="text"
              name="registerUsername"
              [(ngModel)]="registerUsername"
              class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-white"
            />
          </div>
          <div class="grid gap-2">
            <label class="text-sm text-slate-300">Email</label>
            <input
              type="email"
              name="registerEmail"
              [(ngModel)]="registerEmail"
              class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-white"
            />
          </div>
          <div class="grid gap-2">
            <label class="text-sm text-slate-300">Password</label>
            <input
              type="password"
              name="registerPassword"
              [(ngModel)]="registerPassword"
              class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-white"
              required
            />
          </div>
          <button appButton type="submit" variant="primary" class="mt-2" [disabled]="isLoading()">
            {{ isLoading() ? 'Creating account...' : 'Register' }}
          </button>
        </form>
      }
    </div>
  </app-card>
</div>
